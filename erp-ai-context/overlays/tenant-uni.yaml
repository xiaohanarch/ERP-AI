overlay:
  tenant_id: T-UNI
  version: uni-a0-1.0.0
  description: 星联科技租户叠加（参数 / 术语 / 派生指标口径）
  parameters:
    large_risk_threshold:
      value: 5000000
      source: 租户A0叠加（星联科技风控制度：单张发票 500 万以上为大额）
      description: 大额风险阈值 500 万
  terms:
