# 标品资产：AP 锚点评测集（资产信封，三层解析的 Standard 层）
# 用例真源在 eval/cases/（50 条，六类），本文件只登记指针与版本——
# 避免两份拷贝漂移；租户层不可覆盖评测集（overridable: false）。
asset:
  name: ap-anchor-evalset
  category: evalsets
  version: std-1.0.0
  overridable: false
  description: AP 域 50 条锚点用例（六类：工具/归因/权限/披露/越权诱导/幻觉）
  source: ../../../eval/cases
  schema: ap-eval-case/1.0
  counts:
    AP-TOOL: 15
    AP-DIAG: 10
    AP-PERM: 7
    AP-COMP: 8
    AP-MISLEAD: 6
    AP-HALLU: 4
  tiers:
    smoke: 冒烟（≤3min，每类机制至少一条）
    regression: 回归（smoke + 常态回归面）
    full: 全量（50 条，双租全量档）
  gates:
    tool_correctness: 0.98
    param_correctness: 0.95
    max_tool_steps: 4
    completeness_disclosure: 1.0        # 零容忍
    hallucination: 0                    # 零容忍
    unauthorized_tool_calls: 0          # 零容忍
