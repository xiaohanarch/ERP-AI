# 场景注册表：工具白名单（场景工具 ∩ Agent 清单 = T2 scope）+ 降级开关
# enabled=false 时：交换与工具调用均拒绝（GW.SCENE_DISABLED），聊天入口直接降级提示。
scenes:
  ap.diag:
    enabled: true
    description: 发票阻断归因诊断（读侧）
    tools:
      - ap.invoice.checkValidation
      - ap.invoice.getMatchDetail
      - ap.invoice.getDerivedField
      - ap.invoice.listBlocked
      - ap.balance.query
      - semantic.metadata.entities
      - semantic.metadata.fields
      - semantic.metric.get
      - semantic.term.translate
      - semantic.task.match
      - semantic.operation.explain
      - semantic.capability.discover
      - semantic.drift.status

  ap.explore:
    enabled: true
    description: 受限自主只读探索（第二档：模型自选工具与顺序，只读+步数上限+平台取证）
    tools:
      - ap.invoice.checkValidation
      - ap.invoice.getMatchDetail
      - ap.invoice.listBlocked
      - ap.invoice.getDerivedField
      - ap.balance.query
      - semantic.capability.discover
      - semantic.operation.explain
      - semantic.term.translate
      - semantic.metadata.entities
      - semantic.metadata.fields

  ap.batch:
    enabled: true
    description: 阻断发票批量筛查（读侧，含大额风险口径）
    tools:
      - ap.invoice.listBlocked
      - ap.balance.query
      - semantic.term.translate
      - semantic.task.match
      - semantic.metric.get

  ap.taxcode:
    enabled: true
    description: 税码建议与补全（写侧，强制审批）
    tools:
      - ap.invoice.checkValidation
      - ap.invoice.applyTaxCode
      - semantic.metric.get
      - semantic.term.translate
      - semantic.metadata.fields

  ap.event:
    enabled: true
    description: 事件触发无头诊断（形态④：ap.invoice.blocked -> 归因 -> 通知）
    tools:
      - ap.invoice.checkValidation
      - ap.invoice.getMatchDetail

  proc.diag:
    enabled: true
    description: 采购域查询（订单详情 / 收货取证，读侧；可独立使用或被 AP 域委派）
    tools:
      - proc.po.getDetail
      - proc.gr.listForPo

  xdom.diag:
    enabled: true
    description: 跨域根因诊断（AP 归因 -> 委派采购域取证 -> 综合结论；委派走注册表协作清单）
    tools:
      - ap.invoice.checkValidation
      - ap.invoice.getMatchDetail
