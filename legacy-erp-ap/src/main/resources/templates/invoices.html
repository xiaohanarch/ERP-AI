<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title>华东制造 ERP - 应付发票</title>
  <style>
    :root { --bg:#f3f4f1; --panel:#fff; --ink:#1c2418; --accent:#2d5a27; --accent2:#4a7a42; --line:#d8dcd2; --warn:#b07a1e; --block:#a1372f; --ok:#2d5a27; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:"Microsoft YaHei","PingFang SC",sans-serif; background:var(--bg); color:var(--ink); font-size:14px; }
    header { background:var(--accent); color:#fff; padding:10px 24px; display:flex; justify-content:space-between; align-items:center; }
    header h1 { font-size:17px; font-weight:600; letter-spacing:1px; }
    header .who { font-size:13px; opacity:.92; }
    header button { background:rgba(255,255,255,.15); color:#fff; border:1px solid rgba(255,255,255,.4); padding:5px 14px; cursor:pointer; font-size:13px; }
    .layout { display:flex; gap:16px; padding:16px 24px; align-items:flex-start; }
    .main { flex:1 1 auto; min-width:0; }
    .copilot { flex:0 0 420px; position:sticky; top:12px; }
    .panel { background:var(--panel); border:1px solid var(--line); box-shadow:0 3px 10px rgba(28,36,24,.06); }
    .panel h2 { font-size:14px; padding:10px 14px; border-bottom:1px solid var(--line); background:#f8f9f5; display:flex; justify-content:space-between; }
    .panel h2 .muted { color:#6b7263; font-weight:400; font-size:12px; }
    table { width:100%; border-collapse:collapse; font-size:13px; }
    th { text-align:left; padding:8px 10px; background:#f1f3ec; border-bottom:1px solid var(--line); color:#3a4234; white-space:nowrap; }
    td { padding:7px 10px; border-bottom:1px solid #eceee6; white-space:nowrap; }
    tr:hover td { background:#f7f9f2; }
    .amt { text-align:right; font-variant-numeric:tabular-nums; }
    .badge { display:inline-block; padding:1px 8px; font-size:12px; border-radius:2px; border:1px solid; }
    .b-pass { color:var(--ok); border-color:var(--ok); background:#eef5ec; }
    .b-warn { color:var(--warn); border-color:var(--warn); background:#faf3e6; }
    .b-block { color:var(--block); border-color:var(--block); background:#f9ebe9; }
    .b-unev { color:#6b7263; border-color:#6b7263; background:#f1f1ee; }
    /* copilot 聊天窗 */
    .chat { display:flex; flex-direction:column; height:560px; }
    .msgs { flex:1; overflow-y:auto; padding:12px; display:flex; flex-direction:column; gap:10px; }
    .msg { max-width:88%; padding:8px 12px; line-height:1.55; font-size:13px; white-space:pre-wrap; word-break:break-word; }
    .msg.user { align-self:flex-end; background:#e2e8d8; border:1px solid #cfd8c4; }
    .msg.bot { align-self:flex-start; background:#fbfbf9; border:1px solid var(--line); }
    .msg.sys { align-self:center; font-size:12px; color:#8a4b12; background:#faf3e6; border:1px dashed #d9c193; }
    .msg .meta { display:block; margin-top:6px; font-size:11px; color:#6b7263; }
    .cmd { display:flex; gap:8px; padding:10px; border-top:1px solid var(--line); background:#f8f9f5; }
    .cmd input { flex:1; padding:8px 10px; border:1px solid var(--line); font-size:13px; }
    .cmd button { padding:8px 18px; background:var(--accent2); color:#fff; border:none; cursor:pointer; }
    .cmd button:disabled { opacity:.5; cursor:default; }
    .quick { display:flex; flex-wrap:wrap; gap:6px; padding:8px 10px; border-top:1px dashed var(--line); }
    .quick a { font-size:12px; padding:3px 10px; background:#eef1e9; border:1px solid var(--line); cursor:pointer; }
    .quick a:hover { background:#e2e8d8; }
    .placeholder { color:#9aa093; align-self:center; margin:auto; font-size:13px; }
  </style>
</head>
<body>
<header>
  <h1>华东制造 ERP · 应付发票</h1>
  <div class="who">
    <span id="who">-</span>　<button onclick="logout()">退出</button>
  </div>
</header>
<div class="layout">
  <div class="main panel">
    <h2>发票列表 <span class="muted" id="listMeta">加载中…</span></h2>
    <table>
      <thead><tr><th>发票号</th><th>供应商</th><th class="amt">金额(元)</th><th>税码</th><th>期间</th><th>校验状态</th><th>操作</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
  <div class="copilot panel">
    <h2>应付 Copilot <span class="muted">页面内嵌 · 经 AI 网关</span></h2>
    <div class="chat">
      <div class="msgs" id="msgs"><div class="placeholder">向应付 Copilot 提问，例如：INV-A-001 为什么被阻断？</div></div>
      <div class="quick" id="quick">
        <a>INV-A-001 为什么被阻断？</a>
        <a>帮我筛查被阻断的发票</a>
        <a>有哪些大额风险的发票？</a>
        <a>帮我处理 INV-A-003 的税码</a>
      </div>
      <div class="cmd">
        <input id="input" placeholder="提问，或输入 / 唤起 AI Command" autocomplete="off"/>
        <button id="send">发送</button>
      </div>
    </div>
  </div>
</div>
<script>
  const GW = window.GW_BASE || (location.protocol + '//' + location.hostname + ':8000');
  const t1 = sessionStorage.getItem('t1');
  if (!t1) { location.href = '/login'; }

  // ---------- 页面数据 ----------
  async function loadMe() {
    const r = await fetch('/uiapi/me');
    if (!r.ok) { location.href = '/login'; return null; }
    const me = await r.json();
    document.getElementById('who').textContent =
      `${me.displayName}（${me.tenantId} · ${me.org}）`;
    return me;
  }
  async function loadInvoices() {
    const r = await fetch('/uiapi/invoices');
    const data = await r.json();
    document.getElementById('listMeta').textContent = `共 ${data.total} 条（当前用户数据权限口径）`;
    const tb = document.getElementById('rows');
    tb.innerHTML = '';
    for (const inv of data.items) {
      const tr = document.createElement('tr');
      const badge = { PASSED:'b-pass', WARNED:'b-warn', BLOCKED:'b-block', UNEVALUATED:'b-unev' }[inv.validationStatus] || 'b-unev';
      tr.innerHTML = `<td>${inv.invoiceNo}</td><td>${inv.supplier || '-'}</td>
        <td class="amt">${Number(inv.amountCny).toLocaleString('zh-CN')}</td>
        <td>${inv.taxCode || '-'}</td><td>${inv.period}</td>
        <td><span class="badge ${badge}">${inv.validationStatus}</span></td>
        <td><a href="javascript:void(0)" onclick="askAbout('${inv.invoiceNo}')">问 Copilot</a></td>`;
      tb.appendChild(tr);
    }
  }

  // ---------- Copilot（SSE 流式） ----------
  const msgs = document.getElementById('msgs');
  function clearPlaceholder() { const p = msgs.querySelector('.placeholder'); if (p) p.remove(); }
  function addUser(text) {
    clearPlaceholder();
    const d = document.createElement('div'); d.className = 'msg user'; d.textContent = text;
    msgs.appendChild(d); msgs.scrollTop = msgs.scrollHeight;
  }
  function addSys(text) {
    const d = document.createElement('div'); d.className = 'msg sys'; d.textContent = text;
    msgs.appendChild(d); msgs.scrollTop = msgs.scrollHeight;
  }
  function startBot() {
    const d = document.createElement('div'); d.className = 'msg bot'; d.textContent = '…';
    msgs.appendChild(d); msgs.scrollTop = msgs.scrollHeight;
    return d;
  }
  function askAbout(invoiceNo) {
    document.getElementById('input').value = `${invoiceNo} 为什么被阻断？`;
    send();
  }
  async function send() {
    const input = document.getElementById('input');
    const text = input.value.trim();
    if (!text || !t1) return;
    input.value = '';
    addUser(text);
    // AI Command：/ 前缀快速命令
    const message = text.startsWith('/')
      ? text.replace(/^\/(check|blocked|large)\s*/i, (m) => ({
          '/check': '请校验发票 ', '/blocked': '请筛查被阻断的发票，', '/large': '请筛查大额风险发票，'
        }[m.trim().toLowerCase().split(' ')[0]] || m))
      : text;
    const bot = startBot();
    document.getElementById('send').disabled = true;
    try {
      const r = await fetch(GW + '/gw/chat/stream', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + t1 },
        body: JSON.stringify({ message, surface: 'surface-erp-page' })
      });
      if (!r.ok) {
        bot.textContent = '网关错误：' + r.status + ' ' + (await r.text()).slice(0, 200);
        return;
      }
      const reader = r.body.getReader();
      const decoder = new TextDecoder();
      let buf = '', full = '';
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += decoder.decode(value, { stream: true });
        const parts = buf.split('\n\n');
        buf = parts.pop();
        for (const part of parts) {
          for (const line of part.split('\n')) {
            if (!line.startsWith('data:')) continue;
            const payload = line.slice(5).trim();
            if (payload === '[DONE]') continue;
            try {
              const ev = JSON.parse(payload);
              if (ev.type === 'token') { full += ev.text; bot.textContent = full; }
              else if (ev.type === 'approval_required') {
                addSys(`该操作需要审批（单号 ${ev.approval_id}），已通知审批人在 WorkBuddy 处理。`);
                bot.textContent = full || '（已挂起等待审批）';
              } else if (ev.type === 'meta') {
                bot.innerHTML = full +
                  `<span class="meta">场景 ${ev.scene} · trace ${String(ev.trace_id).slice(0, 16)} · ${ev.agent}</span>`;
              } else if (ev.type === 'error') {
                bot.textContent = (full || '') + '\n[错误] ' + ev.message;
              }
            } catch (e) { /* 非 JSON 忽略 */ }
          }
        }
        msgs.scrollTop = msgs.scrollHeight;
      }
      if (!bot.textContent || bot.textContent === '…') bot.textContent = full || '（无输出）';
    } catch (e) {
      bot.textContent = '连接失败：' + e.message;
    } finally {
      document.getElementById('send').disabled = false;
    }
  }
  document.getElementById('send').onclick = send;
  document.getElementById('input').addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
  document.querySelectorAll('#quick a').forEach(a => a.onclick = () => { document.getElementById('input').value = a.textContent; send(); });
  async function logout() {
    await fetch('/uiapi/auth/logout', { method: 'POST' });
    sessionStorage.clear();
    location.href = '/login';
  }

  loadMe().then(() => loadInvoices());
</script>
</body>
</html>
