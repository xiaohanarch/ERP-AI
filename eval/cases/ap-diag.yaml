# AP 锚点用例 · 归因结论正确性（10 条）
# 检查层：确定性（结论包含正确规则号 / 严重级别 / 单据状态；不得包含错误归因）。
schema: ap-eval-case/1.0
cases:
  - id: AP-DIAG-001
    title: 李四看 INV-A-001 完整归因（数量差异 + 预算超支）
    category: AP-DIAG
    tier: smoke
    user: lisi
    scene: ap.diag
    message: "INV-A-001 为什么会被拦下来？"
    seed_deps: [INV-A-001]
    expect:
      tools: [ap.invoice.checkValidation]
      forbidden_tools: [ap.payment.execute]
      max_tool_steps: 3
      answer_contains: ["INV-A-001", "阻断", "AP.MATCH.QTY_MISMATCH", "AP.BUDGET.EXCEEDED"]
      answer_not_contains: []
      error_code: NONE

